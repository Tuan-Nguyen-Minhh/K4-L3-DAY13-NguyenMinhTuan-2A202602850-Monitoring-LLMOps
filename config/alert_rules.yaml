alerts:
  - name: llm-high-latency-p95
    severity: critical
    condition: 'percentile(response_sent.latency_ms, 95) > 3000ms'
    duration: 5m
    type: symptom-based
    channel: "slack:#sre-llmops-alerts"
    owner: backend-oncall
    runbook: docs/alerts.md#alert-1
    sli: fast_successful_requests
    threshold_ref: config/dashboard.yaml#latency/p95

  - name: llm-high-error-rate
    severity: high
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: "slack:#sre-llmops-alerts"
    owner: backend-oncall
    runbook: docs/alerts.md#alert-2
    sli: fast_successful_requests
    threshold_ref: config/dashboard.yaml#errors/error_rate_pct

  - name: llm-quality-drop
    severity: high
    condition: 'mean(response_sent.quality_score) < 0.75'
    duration: 10m
    type: symptom-based
    channel: "slack:#sre-llmops-alerts"
    owner: llm-quality-owner
    runbook: docs/alerts.md#alert-3
    sli: quality_proxy
    threshold_ref: config/dashboard.yaml#quality/mean
